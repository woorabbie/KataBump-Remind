name: Expire_Month Reminder

on:
  workflow_dispatch:
  schedule:
    # 每天 01:00 UTC（日本时间10:00）
    - cron: "0 1 * * *"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check monthly expire reminder
        run: |
          TODAY=$(date -u +%F)
          TODAY_SECONDS=$(date -d "$TODAY" +%s)

          echo "Today: $TODAY"

          # 格式：用户名|首次到期日期|费用
          USERS=(
            "leo|2026-07-25|月付20/月"
          )

          for USER in "${USERS[@]}"
          do
            IFS="|" read NAME START_DATE PRICE <<< "$USER"

            START_SECONDS=$(date -d "$START_DATE" +%s)

            DIFF_DAYS=$(( (TODAY_SECONDS - START_SECONDS) / 86400 ))

            # 计算距离下次30天周期到期剩余天数
            REMAIN_DAYS=$((30 - (DIFF_DAYS % 30)))

            # 到期当天修正为0
            if [ "$REMAIN_DAYS" -eq 30 ]; then
              REMAIN_DAYS=0
            fi

            echo "$NAME 剩余 $REMAIN_DAYS 天"

            if [ "$REMAIN_DAYS" -le 2 ]; then

              CYCLE=$((DIFF_DAYS / 30 + 1))

              NEXT_EXPIRE=$(date -d "$START_DATE + $((CYCLE * 30)) days" +%F)

              MESSAGE="🔔 Expire Time提醒：
                      用户：${NAME}
                      海外云服务器即将到期，请提醒续费。
                      
                      首次日期：${START_DATE}
                      下次到期：${NEXT_EXPIRE}
                      周期：30天（月付）
                      剩余：${REMAIN_DAYS}天"

              curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
                -d chat_id=${{ secrets.CHAT_ID }} \
                --data-urlencode text="$MESSAGE"

            else
              echo "$NAME 今天无需提醒。"
            fi

          done
