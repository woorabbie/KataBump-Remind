name: dpdns.org domains Reminder

on:
  workflow_dispatch:
  schedule:
    # 每天 01:00 UTC（日本时间10:00）
    - cron: "0 1 * * *"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check if today is a reminder day
        run: |
          TODAY=$(date -u +%F)
          TODAY_SECONDS=$(date -d "$TODAY" +%s)

          echo "Today: $TODAY"

          # 格式：开始日期|GitHub账号|域名说明
          DOMAINS=(
            "2024-12-06|595909839@qq.com|3个域名realive.dpdns.org等"
            "2026-07-05|qn322060@gmail.com|1个域名 winyi.dpdns.org"
            "2026-07-29|wurabbie@gmail.com|2个域名oio.dpdns.org,oro.dpdns.org"	    
          )

          for ITEM in "${DOMAINS[@]}"
          do
            IFS="|" read START_DATE ACCOUNT DOMAIN_INFO <<< "$ITEM"

            START_SECONDS=$(date -d "$START_DATE" +%s)

            DIFF_DAYS=$(( (TODAY_SECONDS - START_SECONDS) / 86400 ))

            echo "Checking $ACCOUNT $START_DATE Diff: $DIFF_DAYS"

            REMAIN_DAYS=$((365 - (DIFF_DAYS % 365)))

            if [ "$REMAIN_DAYS" -le 3 ] && [ "$REMAIN_DAYS" -gt 0 ]; then

              YEAR=$((DIFF_DAYS / 365 + 1))

              MESSAGE="🔔 dpdns.org domains提醒：
                    GitHub账号：${ACCOUNT}
                    注册日期：${START_DATE}
                    域名：${DOMAIN_INFO}
                    管理地址：https://dash.domain.digitalplat.org/dashboard
                    
                    需要续期！
                    （第 ${DIFF_DAYS} 天，第 ${YEAR} 年）"

              curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
                -d chat_id=${{ secrets.CHAT_ID }} \
                --data-urlencode text="$MESSAGE"

            else
              echo "$ACCOUNT ($START_DATE) 今天不是提醒日。"
            fi
          done
